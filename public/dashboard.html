<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Scion · Dashboard</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/shared.css" />
  <script src="/js/nav.js"></script>
  <script src="/js/fullscreen.js"></script>
  <script src="/js/visualizers/sacred-spiral.js"></script>
  <style>
    :root {
      /* Dashboard keeps its own green "plant" palette; --accent/--ok match
         shared.css already so they're not repeated here. */
      --bg:       #090d0b;
      --panel:    #0d1210;
      --border:   #1e2a22;
      --border-l: #2a3d30;
      --fg:       #d8e6da;
      --muted:    #6a8872;
      --plant:    #3a7d44;
      --plant-l:  #6ab87a;
      --card-glow: 0 2px 18px rgba(0,200,80,.05);
      --card-hov:  0 4px 28px rgba(0,200,80,.12);
    }
    :root[data-theme="light"] {
      --bg:       #f6f9f6;
      --panel:    #ffffff;
      --border:   #d7e2da;
      --border-l: #c2d3c7;
      --fg:       #16241a;
      --muted:    #4c6857;
      --plant:    #2f6636;
      --plant-l:  #3d8a4c;
      --card-glow: 0 2px 14px rgba(0,120,50,.08);
      --card-hov:  0 4px 22px rgba(0,120,50,.14);
    }
    * { margin: 0; padding: 0; }
    html { font: 13px/1.5 -apple-system,"Segoe UI",system-ui,sans-serif; }
    body { background: var(--bg); color: var(--fg); min-height: 100vh; overflow-x: hidden; }

    /* ── Header ──────────────────────────────────────────────────────────── */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; height: 52px;
      background: rgba(13,18,16,.97);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
      backdrop-filter: blur(10px);
    }
    .hdr-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .hdr-brand {
      font-size: 13px; font-weight: 600; letter-spacing: .4px;
      color: var(--fg); white-space: nowrap;
    }
    .hdr-brand span { color: var(--plant-l); }
    .hdr-btn {
      width: 28px; height: 28px; padding: 0; flex-shrink: 0;
      background: transparent; border: 1px solid var(--border); color: var(--muted);
      border-radius: 6px; font-size: 15px; line-height: 1; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .hdr-btn:hover { color: var(--fg); border-color: var(--muted); }
    .hdr-conn { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex-shrink: 0; transition: background .4s; }
    .dot.live { background: var(--ok); box-shadow: 0 0 5px var(--ok); }
    .conn-label { font-size: 11px; color: var(--muted); }
    .conn-label.live { color: var(--ok); }
    /* ── Page layout ─────────────────────────────────────────────────────── */
    .page { max-width: 1400px; margin: 0 auto; padding: 24px 24px 48px; }

    /* ── Section labels ──────────────────────────────────────────────────── */
    .section-label {
      font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
      color: var(--muted); font-weight: 700; margin-bottom: 14px;
    }

    /* ── Live pane ───────────────────────────────────────────────────────── */
    /* Always a single full-width column — the readings panel below the live
       view spans the whole page width rather than being squeezed into a
       narrow fixed side column. */
    .live-pane {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-bottom: 36px;
    }
    @media (max-width: 480px) {
      .page { padding: 16px 16px 32px; }
      header { padding: 0 16px; }
      .hdr-conn .conn-label { display: none; }
      .viz-picker select { padding: 4px 6px; font-size: 10px; }
    }

    .live-viz {
      position: relative; border-radius: 10px; overflow: hidden;
      border: 1px solid var(--border); background: var(--panel);
      box-shadow: var(--card-glow);
      /* Height is set explicitly in JS (see sizeLiveViz below) from the
         box's own measured width — sidesteps any aspect-ratio/padding-hack
         ambiguity entirely and guarantees the iframe has a definite,
         correct pixel height to fill. */
      width: 100%; min-width: 0;
    }
    .live-viz iframe {
      position: absolute; inset: 0; width: 100%; height: 100%;
      border: none; display: block;
    }

    /* Visualizer picker, in the header next to the title — chooses which of
       the four visualizers (Plant Signal / Mycelium / Spiral / Tapestry)
       shows in the embedded live preview. */
    .viz-picker { flex-shrink: 1; min-width: 0; }
    .viz-picker select {
      border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px;
      font-size: 11px; font-weight: 600; color: var(--fg);
      background: var(--panel-2); cursor: pointer;
    }

    /* ── Live readings panel ─────────────────────────────────────────────── */
    .live-panel {
      display: flex; flex-direction: column; gap: 12px; min-width: 0;
    }
    .live-readings {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 10px; padding: 16px;
      box-shadow: var(--card-glow); flex: 1;
    }
    .live-plant {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 10px; padding: 14px;
      box-shadow: var(--card-glow);
    }
    .lp-name {
      font-size: 13px; font-weight: 600; color: var(--plant-l);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .lp-species {
      font-size: 11px; color: var(--muted); font-style: italic;
      margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .lp-none { font-size: 11px; color: var(--muted); }

    /* sparkline rows */
    .spark-row {
      display: grid; grid-template-columns: 52px 1fr 52px;
      gap: 0 8px; align-items: center;
      margin-bottom: 8px;
    }
    .spark-row:last-child { margin-bottom: 0; }
    .spark-field { font-size: 10px; color: var(--muted); font-family: var(--mono); }
    .spark-val   { font-size: 10px; color: var(--fg); font-family: var(--mono); text-align: right; }
    /* min-width:0 overrides the grid item's default content-based minimum
       size — without it, a <canvas>'s intrinsic width (300px by default,
       or its device-pixel-scaled drawing-buffer width once JS sets it)
       forces the 1fr track wider than the viewport on narrow phones. */
    .spark-canvas { display: block; width: 100%; height: 28px; min-width: 0; }

    /* ── Gallery ─────────────────────────────────────────────────────────── */
    .gallery-header {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: 16px;
    }
    .gallery-export-btn {
      padding: 7px 14px; border-radius: 7px; border: 1px solid var(--plant);
      background: transparent; color: var(--plant-l);
      font-size: 11px; font-weight: 600; cursor: pointer;
      transition: background .15s;
    }
    .gallery-export-btn:hover { background: rgba(58,125,68,.15); }
    .gallery-export-btn:disabled { opacity: .5; cursor: default; }
    .gallery-empty {
      color: var(--muted); font-size: 12px; padding: 32px 0;
      text-align: center; border: 1px dashed var(--border);
      border-radius: 10px;
    }

    /* card grid */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--panel);
      border: 1px solid rgba(58,125,68,.30);
      border-radius: 10px; overflow: hidden;
      box-shadow: var(--card-glow);
      transition: box-shadow .2s, border-color .2s;
      display: flex; flex-direction: column;
    }
    .card:hover {
      box-shadow: var(--card-hov);
      border-color: rgba(106,184,122,.45);
    }

    .card-thumb {
      position: relative; aspect-ratio: 16/9; background: #050908;
      overflow: hidden; flex-shrink: 0; cursor: zoom-in;
    }
    .card-thumb img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      opacity: .92;
    }
    .card-thumb canvas {
      display: block; width: 100%; height: 100%;
    }

    .card-body { padding: 12px 14px; flex: 1; display: flex; flex-direction: column; gap: 6px; }

    .card-plant-name {
      font-size: 13px; font-weight: 600; color: var(--plant-l);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .card-plant-row {
      display: flex; align-items: center; gap: 4px;
      font-size: 11px; color: var(--muted);
    }
    .card-plant-row em { font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .card-plant-row a { color: var(--accent); text-decoration: none; font-size: 11px; flex-shrink: 0; }
    .card-plant-row a:hover { text-decoration: underline; }

    .card-divider { border: none; border-top: 1px solid var(--border); }

    .card-meta {
      font-size: 11px; color: var(--muted); font-family: var(--mono);
    }
    .card-date { font-size: 11px; color: var(--fg); margin-bottom: 2px; }
    .card-footer { margin-top: auto; padding-top: 8px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .card-public-toggle {
      display: flex; align-items: center; gap: 4px;
      font-size: 11px; color: var(--muted); cursor: pointer; flex-shrink: 0;
    }
    .card-public-toggle input { accent-color: var(--plant); cursor: pointer; }
    .card-link {
      flex: 1; display: block; text-align: center;
      padding: 6px 10px; border-radius: 6px;
      border: 1px solid var(--border-l); color: var(--muted);
      font-size: 11px; text-decoration: none;
      transition: color .15s, border-color .15s;
    }
    .card-link:hover { color: var(--fg); border-color: var(--plant); }
    .card-del {
      padding: 6px 10px; border-radius: 6px;
      border: 1px solid var(--border-l); color: var(--muted);
      font-size: 11px; cursor: pointer; background: none;
      transition: color .15s, border-color .15s;
    }
    .card-del:hover { color: #ef476f; border-color: #ef476f; }

    .badge-rec {
      position: absolute; top: 6px; right: 6px;
      padding: 2px 6px; border-radius: 4px;
      background: rgba(0,0,0,.7); border: 1px solid var(--plant);
      color: var(--plant-l); font-size: 9px; font-family: var(--mono);
      letter-spacing: 1px; text-transform: uppercase;
    }

    /* ── Fullsize lightbox ───────────────────────────────────────────────── */
    .lightbox {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(5,9,7,.92); backdrop-filter: blur(4px);
      display: none; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px; padding: 24px;
    }
    .lightbox.open { display: flex; }
    .lightbox-frame {
      position: relative;
      max-width: min(1100px, 92vw); max-height: 78vh;
      border-radius: 12px; overflow: visible;
      border: 1px solid var(--border-l); box-shadow: 0 8px 60px rgba(0,0,0,.5);
      background: #0e1014;
      display: flex; align-items: center; justify-content: center;
    }
    .lightbox-frame canvas { display: block; border-radius: 12px; }
    .lightbox-close {
      position: absolute; top: -14px; right: -14px; z-index: 1;
      width: 30px; height: 30px; border-radius: 50%; padding: 0;
      background: var(--panel); border: 1px solid var(--border-l); color: var(--fg);
      font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .lightbox-close:hover { border-color: var(--plant); }
    .lightbox-loading {
      color: var(--muted); font-size: 12px; padding: 40px 60px;
    }
    .lightbox-meta { color: var(--fg); text-align: center; }
    .lightbox-meta .lb-name { font-size: 15px; font-weight: 600; color: var(--plant-l); }
    .lightbox-meta .lb-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  </style>
</head>
<body>

  <header>
    <div class="hdr-left">
      <div class="hdr-brand">Scion · <span>Dashboard</span></div>
      <div class="viz-picker">
        <select id="vizSelect">
          <option value="plant">Plant Signal</option>
          <option value="organic">Mycelium</option>
          <option value="sacred">Spiral</option>
          <option value="tapestry">Tapestry</option>
        </select>
      </div>
      <button type="button" class="hdr-btn" id="fsBtn" title="Fullscreen (F)">⛶</button>
    </div>
    <div class="hdr-conn">
      <span class="dot" id="connDot"></span>
      <span class="conn-label" id="connLabel">connecting…</span>
    </div>
    <div data-scion-nav data-page="dashboard"></div>
  </header>

  <div class="page">

    <!-- Live pane -->
    <div class="section-label">Live</div>
    <div class="live-pane">

      <div class="live-viz">
        <!-- No src here on purpose: it's set by JS only after .live-viz has
             its final measured height, so the Visualizer page never loads
             (and bakes in canvas geometry) against a not-yet-sized box. -->
        <iframe id="liveFrame" title="Live view" allow="autoplay"></iframe>
      </div>

      <div class="live-panel">
        <div class="live-plant" id="livePlant">
          <div class="lp-none">No plant set — open the visualizer to add one.</div>
        </div>
        <div class="live-readings">
          <div class="section-label" style="margin-bottom:10px">Readings</div>
          <div id="sparkRows"></div>
        </div>
      </div>
    </div>

    <!-- Gallery -->
    <div class="gallery-header">
      <div class="section-label" style="margin-bottom:0">Recordings</div>
      <button type="button" class="gallery-export-btn" id="exportGalleryBtn" title="Bundle every session marked Public into one self-contained HTML file you can share anywhere">Export public gallery</button>
    </div>
    <div id="gallery"><div class="gallery-empty">No recordings found.</div></div>

  </div>

  <div class="lightbox" id="lightbox">
    <div class="lightbox-frame" id="lightboxFrame">
      <button type="button" class="lightbox-close" id="lightboxClose" title="Close (Esc)">✕</button>
      <div class="lightbox-loading" id="lightboxLoading">Reconstructing…</div>
    </div>
    <div class="lightbox-meta" id="lightboxMeta"></div>
  </div>

  <script>
    // ── Fields / colours ──────────────────────────────────────────────────
    const FIELDS = ['min', 'max', 'mean', 'delta', 'variance', 'deviation'];
    const COLORS = {
      min: '#4cc9f0', max: '#f72585', mean: '#ffd166',
      delta: '#06d6a0', variance: '#b388ff', deviation: '#ff8c42',
    };
    const SPARK_LEN = 80;

    // ── Build sparkline rows ──────────────────────────────────────────────
    const sparkHist = Object.fromEntries(FIELDS.map(f => [f, []]));
    const sparkCtxs = {};
    const sparkRows = document.getElementById('sparkRows');

    function buildSparkRows() {
      const dpr = window.devicePixelRatio || 1;
      for (const f of FIELDS) {
        const row = document.createElement('div');
        row.className = 'spark-row';
        row.innerHTML = `
          <span class="spark-field">${f}</span>
          <canvas class="spark-canvas" id="dsp-${f}" height="28"></canvas>
          <span class="spark-val" id="dsv-${f}">—</span>`;
        sparkRows.appendChild(row);
      }
      // Size canvases after they're in the DOM
      requestAnimationFrame(() => {
        for (const f of FIELDS) {
          const c = document.getElementById('dsp-' + f);
          const w = c.offsetWidth || 160;
          c.width  = Math.round(w * dpr);
          c.height = Math.round(28 * dpr);
          const cx = c.getContext('2d');
          cx.scale(dpr, dpr);
          sparkCtxs[f] = { cx, w, h: 28 };
        }
      });
    }
    buildSparkRows();

    // ── Live-viz sizing ─────────────────────────────────────────────────────
    // Set an explicit pixel height from the box's own measured width (16:9),
    // instead of relying on CSS aspect-ratio/padding-hack techniques, so the
    // embedded iframe always has an unambiguous, definite height to fill.
    const liveViz = document.querySelector('.live-viz');
    function sizeLiveViz() {
      const w = liveViz.clientWidth;
      if (w > 0) liveViz.style.height = Math.round(w * 9 / 16) + 'px';
    }
    new ResizeObserver(sizeLiveViz).observe(liveViz);
    sizeLiveViz();

    function drawSpark(field, smooth) {
      const sc = sparkCtxs[field];
      if (!sc) return;
      const { cx, w, h } = sc;
      const data = sparkHist[field];
      cx.clearRect(0, 0, w, h);
      if (data.length < 2) return;

      let lo = Infinity, hi = -Infinity;
      for (const v of data) { if (v < lo) lo = v; if (v > hi) hi = v; }
      const span = hi - lo || 1;
      const pad  = 2;
      const innerH = h - pad * 2;
      const xp = i => (i / (data.length - 1)) * w;
      const yp = v => pad + innerH - ((v - lo) / span) * innerH;

      cx.beginPath();
      cx.moveTo(xp(0), h);
      for (let i = 0; i < data.length; i++) cx.lineTo(xp(i), yp(data[i]));
      cx.lineTo(xp(data.length - 1), h);
      cx.closePath();
      cx.fillStyle = COLORS[field] + '22';
      cx.fill();

      cx.beginPath();
      for (let i = 0; i < data.length; i++) {
        const px = xp(i), py = yp(data[i]);
        i === 0 ? cx.moveTo(px, py) : cx.lineTo(px, py);
      }
      cx.strokeStyle = COLORS[field];
      cx.lineWidth = 1.2;
      cx.lineJoin = cx.lineCap = 'round';
      cx.stroke();

      // dot at latest
      cx.beginPath();
      cx.arc(xp(data.length - 1), yp(data[data.length - 1]), 2, 0, Math.PI * 2);
      cx.fillStyle = COLORS[field];
      cx.fill();
    }

    // ── Visualizer picker (which viz shows in the live pane) ───────────────
    // Same localStorage key the standalone Visualizer page itself reads/
    // writes ('scion-active-viz'), so picking one here also updates what
    // you'd see if you open /viz directly, and vice versa.
    const VIZ_KEY    = 'scion-active-viz';
    const VIZ_VALUES = ['plant', 'organic', 'sacred', 'tapestry'];
    const liveFrame  = document.getElementById('liveFrame');
    const vizSelect  = document.getElementById('vizSelect');

    function setLiveViz(viz) {
      liveFrame.src = `/viz?embed&viz=${viz}`;
      try { localStorage.setItem(VIZ_KEY, viz); } catch (_) {}
    }
    vizSelect.addEventListener('change', () => setLiveViz(vizSelect.value));

    let savedViz = null;
    try { savedViz = localStorage.getItem(VIZ_KEY); } catch (_) {}
    const initialViz = VIZ_VALUES.includes(savedViz) ? savedViz : 'sacred';
    vizSelect.value = initialViz;
    setLiveViz(initialViz);

    // ── Fullscreen ──────────────────────────────────────────────────────────
    // Targets the whole document, not just .live-viz: the Fullscreen API only
    // keeps the target element (and its descendants) visible/interactive —
    // #fsBtn lives in <header>, a sibling of .live-viz, so scoping fullscreen
    // to .live-viz would hide the very button needed to exit it again.
    initFullscreen(document.getElementById('fsBtn'));

    // ── WebSocket ─────────────────────────────────────────────────────────
    const smooth = Object.fromEntries(FIELDS.map(f => [f, null]));
    let isRelay = false;

    function fmt(v) {
      if (v === null || v === undefined) return '—';
      const a = Math.abs(v);
      if (a >= 1000 || (a > 0 && a < 0.001)) return v.toExponential(2);
      return v.toFixed(3);
    }

    function connectWs() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(`${proto}://${location.host}/ws`);
      const ALPHA = 0.12;

      ws.onopen = () => {
        document.getElementById('connDot').classList.add('live');
        document.getElementById('connLabel').classList.add('live');
        document.getElementById('connLabel').textContent = 'live';
      };
      ws.onclose = () => {
        document.getElementById('connDot').classList.remove('live');
        document.getElementById('connLabel').classList.remove('live');
        document.getElementById('connLabel').textContent = 'reconnecting…';
        setTimeout(connectWs, 3000);
      };
      ws.onerror = () => ws.close();

      ws.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.type === 'sample') {
            const f = msg.field;
            if (smooth[f] === null) smooth[f] = msg.value;
            else smooth[f] += ALPHA * (msg.value - smooth[f]);
          } else if (msg.type === 'hello') {
            if (msg.latest) {
              for (const f of FIELDS) {
                if (msg.latest[f] != null) smooth[f] = msg.latest[f];
              }
            }
            if (msg.isRelay) {
              isRelay = true;
              // Hides any owner-only controls rendered before hello arrived —
              // a relay viewer shouldn't delete, curate, or export someone
              // else's recordings.
              document.querySelectorAll('.card-del, .card-public-toggle').forEach(b => b.style.display = 'none');
              const exportBtn = document.getElementById('exportGalleryBtn');
              if (exportBtn) exportBtn.style.display = 'none';
            }
          }
        } catch (_) {}
      };
    }
    connectWs();

    // Tick readings display at 4 Hz
    setInterval(() => {
      for (const f of FIELDS) {
        const v = smooth[f];
        const el = document.getElementById('dsv-' + f);
        if (el) el.textContent = fmt(v);
        if (typeof v === 'number' && Number.isFinite(v)) {
          const hist = sparkHist[f];
          hist.push(v);
          if (hist.length > SPARK_LEN) hist.shift();
          drawSpark(f, v);
        }
      }
    }, 250);

    // ── Current plant ─────────────────────────────────────────────────────
    async function loadLivePlant() {
      try {
        const p = await fetch('/api/plant').then(r => r.json());
        const el = document.getElementById('livePlant');
        if (p.name || p.species) {
          el.innerHTML = `
            <div class="lp-name">${escHtml(p.name || '—')}</div>
            <div class="lp-species">${escHtml(p.species || '')}</div>
            ${p.url ? `<a href="${escHtml(p.url)}" target="_blank" rel="noopener"
                style="font-size:10px;color:var(--accent);text-decoration:none;margin-top:4px;display:inline-block">
                ↗ plant info</a>` : ''}`;
        } else {
          el.innerHTML = '<div class="lp-none">No plant set.</div>';
        }
      } catch (_) {}
    }
    loadLivePlant();

    // ── Gallery ───────────────────────────────────────────────────────────
    function escHtml(s) {
      return String(s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function fmtDate(ms) {
      if (!ms) return '—';
      const d = new Date(ms);
      return d.toLocaleDateString(undefined, { day:'numeric', month:'short', year:'numeric' })
           + '  ' + d.toLocaleTimeString(undefined, { hour:'2-digit', minute:'2-digit' });
    }

    function fmtDuration(startMs, endMs) {
      const sec = Math.round((endMs - startMs) / 1000);
      if (sec < 60) return `${sec}s`;
      const m = Math.floor(sec / 60), s = sec % 60;
      return `${m}m ${s < 10 ? '0' : ''}${s}s`;
    }

    function fmtPoints(n) {
      if (!n) return '—';
      return n >= 1000 ? (n / 1000).toFixed(1) + 'k pts' : n + ' pts';
    }

    // Dark placeholder for sessions with no recorded data points.
    function drawNoData(canvas) {
      const dpr = window.devicePixelRatio || 1;
      const w = canvas.offsetWidth || 240, h = canvas.offsetHeight || 135;
      canvas.width  = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      const cx = canvas.getContext('2d');
      cx.scale(dpr, dpr);
      cx.fillStyle = '#0e1014';
      cx.fillRect(0, 0, w, h);
      cx.fillStyle = 'rgba(216,230,218,0.35)';
      cx.font = '11px -apple-system,"Segoe UI",system-ui,sans-serif';
      cx.textAlign = 'center';
      cx.textBaseline = 'middle';
      cx.fillText('no data', w / 2, h / 2);
    }

    // Reconstructs the Spiral visualization from a session's saved data —
    // replaying the same change-detection + drawing logic the live view
    // uses (SacredSpiralVisualizer.replay()) — draws it into the card
    // immediately, then caches it as that session's snapshot via the
    // existing endpoints so future dashboard loads skip straight to the
    // cached PNG instead of recomputing.
    async function reconstructSpiral(canvas, sessionName) {
      const dpr = window.devicePixelRatio || 1;
      const w = Math.round((canvas.offsetWidth || 240) * dpr);
      const h = Math.round((canvas.offsetHeight || 135) * dpr);

      const data = await fetch(`/api/sessions/${encodeURIComponent(sessionName)}?maxPoints=4000`).then(r => r.json());
      const series = data.series || {};
      const hasData = Object.values(series).some(arr => arr && arr.length);
      if (!hasData) {
        drawNoData(canvas);
        return;
      }

      const out = new SacredSpiralVisualizer().replay(w, h, series);
      canvas.width  = w;
      canvas.height = h;
      canvas.getContext('2d').drawImage(out, 0, 0);

      if (isRelay) return; // don't upload snapshots for someone else's recordings

      try {
        const safe = encodeURIComponent(sessionName);
        await fetch(`/api/sessions/${safe}/snapshot`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ dataUrl: out.toDataURL('image/png') }),
        });
        await fetch(`/api/sessions/${safe}/meta`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reconstructed: true }),
        });
      } catch (_) {}
    }

    // ── Fullsize lightbox ───────────────────────────────────────────────────
    // Re-renders the Spiral at a much higher resolution than the cached card
    // thumbnail (which is sized for the small grid cell) — cheap to redo
    // since it's a deterministic replay of the same saved data.
    const lightbox        = document.getElementById('lightbox');
    const lightboxFrame    = document.getElementById('lightboxFrame');
    const lightboxClose    = document.getElementById('lightboxClose');
    const lightboxMeta     = document.getElementById('lightboxMeta');

    function closeLightbox() {
      lightbox.classList.remove('open');
      lightboxFrame.querySelector('canvas')?.remove();
    }
    lightboxClose.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && lightbox.classList.contains('open')) closeLightbox();
    });

    async function openLightbox(s) {
      lightbox.classList.add('open');
      lightboxFrame.querySelector('canvas')?.remove();
      const loading = document.getElementById('lightboxLoading');
      loading.style.display = '';
      loading.textContent = 'Reconstructing…';

      const plant = s.plant || {};
      lightboxMeta.innerHTML = `
        <div class="lb-name">${escHtml(plant.name || s.session)}</div>
        <div class="lb-sub">${plant.species ? escHtml(plant.species) + ' · ' : ''}${fmtDate(s.startMs)} · ${fmtDuration(s.startMs, s.endMs)} · ${fmtPoints(s.points)}</div>`;

      try {
        const data = await fetch(`/api/sessions/${encodeURIComponent(s.session)}?maxPoints=6000`).then(r => r.json());
        const series = data.series || {};
        const hasData = Object.values(series).some(arr => arr && arr.length);
        if (!hasData) { loading.textContent = 'No data recorded for this session.'; return; }

        const maxW = Math.min(window.innerWidth * 0.9, 1100);
        const maxH = window.innerHeight * 0.78;
        let w = maxW, h = w * 9 / 16;
        if (h > maxH) { h = maxH; w = h * 16 / 9; }
        const dpr = window.devicePixelRatio || 1;
        const pxW = Math.round(w * dpr), pxH = Math.round(h * dpr);

        const out = new SacredSpiralVisualizer().replay(pxW, pxH, series);
        out.style.cssText = `width:${Math.round(w)}px;height:${Math.round(h)}px`;
        loading.style.display = 'none';
        lightboxFrame.appendChild(out);
      } catch (err) {
        loading.textContent = `Could not load: ${err.message}`;
      }
    }

    async function loadGallery() {
      try {
        const data = await fetch('/api/sessions').then(r => r.json());
        const sessions = data.sessions || [];
        const el = document.getElementById('gallery');

        if (!sessions.length) {
          el.innerHTML = '<div class="gallery-empty">No recordings found. Start recording in the Chart or Visualizer pages.</div>';
          return;
        }

        const grid = document.createElement('div');
        grid.className = 'card-grid';
        const needsReconstruct = [];

        for (const s of sessions) {
          const plant = s.plant || {};
          const safeName = s.session.replace(/[^a-zA-Z0-9_\-]/g, '_');

          const card = document.createElement('div');
          card.className = 'card';

          const thumb = document.createElement('div');
          thumb.className = 'card-thumb';

          if (s.reconstructed) {
            const img = document.createElement('img');
            img.src = `/snapshots/${safeName}.png`;
            img.alt = `Spiral reconstruction for ${s.session}`;
            img.loading = 'lazy';
            thumb.appendChild(img);
          } else {
            const c = document.createElement('canvas');
            c.style.cssText = 'width:100%;height:100%;display:block';
            thumb.appendChild(c);
            needsReconstruct.push({ canvas: c, session: s.session });
          }

          if (s.recording?.active || false) {
            const badge = document.createElement('div');
            badge.className = 'badge-rec';
            badge.textContent = 'rec';
            thumb.appendChild(badge);
          }

          thumb.addEventListener('click', () => openLightbox(s));

          const body = document.createElement('div');
          body.className = 'card-body';

          const nameHtml = plant.name
            ? `<div class="card-plant-name">${escHtml(plant.name)}</div>`
            : `<div class="card-plant-name" style="color:var(--muted);font-weight:400">${escHtml(s.session)}</div>`;

          const speciesHtml = plant.species
            ? `<div class="card-plant-row"><em>${escHtml(plant.species)}</em>${
                plant.url ? `<a href="${escHtml(plant.url)}" target="_blank" rel="noopener" title="Plant info">↗</a>` : ''
              }</div>`
            : '';

          body.innerHTML = `
            ${nameHtml}
            ${speciesHtml}
            <hr class="card-divider">
            <div class="card-date">${fmtDate(s.startMs)}</div>
            <div class="card-meta">${fmtDuration(s.startMs, s.endMs)} · ${fmtPoints(s.points)}</div>
            <div class="card-footer">
              <a class="card-link" href="/?session=${encodeURIComponent(s.session)}">Open in chart</a>
              ${isRelay ? '' : `<label class="card-public-toggle" title="Include in public gallery export">
                <input type="checkbox" ${s.public ? 'checked' : ''}> Public</label>`}
              ${isRelay ? '' : '<button class="card-del" title="Delete recording">✕</button>'}
            </div>`;

          if (!isRelay) body.querySelector('.card-public-toggle input').addEventListener('change', async (e) => {
            const checked = e.target.checked;
            try {
              await fetch(`/api/sessions/${encodeURIComponent(s.session)}/meta`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ public: checked }),
              });
            } catch (err) {
              e.target.checked = !checked;
              alert(`Could not update: ${err.message}`);
            }
          });

          if (!isRelay) body.querySelector('.card-del').addEventListener('click', async () => {
            if (!confirm(`Delete recording "${s.session}"?\n\nThis removes all data from InfluxDB and cannot be undone.`)) return;
            try {
              const r = await fetch(`/api/sessions/${encodeURIComponent(s.session)}`, { method: 'DELETE' });
              const d = await r.json();
              if (d.ok) {
                card.style.transition = 'opacity .3s';
                card.style.opacity = '0';
                setTimeout(() => card.remove(), 320);
              } else {
                alert(`Delete failed: ${d.error || 'unknown error'}`);
              }
            } catch (err) {
              alert(`Delete failed: ${err.message}`);
            }
          });

          card.appendChild(thumb);
          card.appendChild(body);
          grid.appendChild(card);
        }

        el.innerHTML = '';
        el.appendChild(grid);

        // Reconstruct missing Spiral thumbnails one at a time — a one-time
        // cost per session (each gets cached via reconstructSpiral), so
        // there's no need to race them all in parallel on this load.
        for (const item of needsReconstruct) {
          await reconstructSpiral(item.canvas, item.session).catch(() => {});
        }
      } catch (err) {
        document.getElementById('gallery').innerHTML =
          `<div class="gallery-empty">Could not load recordings: ${escHtml(err.message)}</div>`;
      }
    }

    loadGallery();

    // ── Public gallery export ────────────────────────────────────────────
    // Fetch + blob + a synthesized <a download> click, rather than a plain
    // navigation — the export can take a few seconds of InfluxDB round-trips
    // for any public session without a cached snapshot, and a raw link would
    // give no loading state and could silently "download" a JSON error body.
    document.getElementById('exportGalleryBtn').addEventListener('click', async () => {
      const btn = document.getElementById('exportGalleryBtn');
      const original = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Generating…';
      try {
        const res = await fetch('/api/gallery/export');
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || `HTTP ${res.status}`);
        }
        const blob = await res.blob();
        const match = /filename="([^"]+)"/.exec(res.headers.get('Content-Disposition') || '');
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = match ? match[1] : 'scion-public-gallery.html';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(a.href);
      } catch (err) {
        alert(`Export failed: ${err.message}`);
      } finally {
        btn.disabled = false;
        btn.textContent = original;
      }
    });
  </script>
</body>
</html>
